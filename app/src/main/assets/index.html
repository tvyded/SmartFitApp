<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fit Mirror — Web AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .mirror-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #finishSetBtn {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 14px 28px;
            background-color: #FF3366;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
            z-index: 9999;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        #finishSetBtn:active {
            transform: scale(0.95);
            background-color: #e02855;
        }

        .overlay-ui {
            position: absolute;
            top: 25px;
            left: 25px;
            bottom: 35px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
        }

        .stats-box {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 30px;
            border-radius: 16px;
            align-self: flex-start;
            backdrop-filter: blur(8px);
        }

        .counter-title {
            font-size: 14px;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }

        .counter-value {
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }

        .status-toast {
            background: rgba(0, 255, 102, 0.12);
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 15px 35px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            align-self: flex-start;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .status-toast.error-mode {
            background: rgba(255, 0, 51, 0.12);
            border-color: #ff0033;
            color: #ff0033;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.2);
            text-shadow: 0 0 5px rgba(255, 0, 51, 0.5);
        }

        #loading {
            position: absolute;
            background: #0a0a0a;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #222;
            border-top: 5px solid #00ff66;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <h2 style="font-weight: 600; letter-spacing: 1px;">Запуск нейросети MediaPipe...</h2>
    <p style="color: #666; margin-top: 10px;">Пожалуйста, предоставьте доступ к камере в приложении</p>
</div>

<button id="finishSetBtn">Завершить подход</button>

<div class="mirror-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div class="overlay-ui">
        <div class="stats-box">
            <div class="counter-title" id="exerciseNameTitle">Упражнение</div>
            <div class="counter-value" id="repCounter">0</div>
        </div>

        <div class="status-toast" id="statusMessage">Начало тренировки</div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    const repCounter = document.getElementById('repCounter');
    const statusMessage = document.getElementById('statusMessage');
    const exerciseNameTitle = document.getElementById('exerciseNameTitle');
    const loadingScreen = document.getElementById('loading');

    const urlParams = new URLSearchParams(window.location.search);
    let currentExercise = urlParams.get('type') || 'squat';

    let repsCount = 0;
    let stage = 'DOWN';

    if (currentExercise === 'squat') exerciseNameTitle.innerText = 'Приседания';
    if (currentExercise === 'biceps') exerciseNameTitle.innerText = 'Подъем на бицепс';
    if (currentExercise === 'shoulders') exerciseNameTitle.innerText = 'Махи плечами';

    function calculateAngle(p1, p2, p3) {
        let radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);

        if (angle > 180.0) {
            angle = 360.0 - angle;
        }

        return angle;
    }

    function analyzePose(landmarks) {
        statusMessage.classList.remove('error-mode');

        if (currentExercise === 'squat') {
            const hip = landmarks[23];
            const knee = landmarks[25];
            const ankle = landmarks[27];

            const kneeAngle = calculateAngle(hip, knee, ankle);

            if (kneeAngle < 100) {
                stage = 'UP';
                statusMessage.innerText = 'Отлично, вставай!';
            }

            if (kneeAngle > 160 && stage === 'UP') {
                repsCount++;
                stage = 'DOWN';
                repCounter.innerText = repsCount;
                statusMessage.innerText = 'Засчитано!';
            }

            if (kneeAngle > 160 && stage === 'DOWN') {
                statusMessage.innerText = 'Приседай глубже';
            }
        } else if (currentExercise === 'biceps') {
            const shoulder = landmarks[11];
            const elbow = landmarks[13];
            const wrist = landmarks[15];

            const elbowAngle = calculateAngle(shoulder, elbow, wrist);

            if (elbowAngle < 40) {
                stage = 'UP';
                statusMessage.innerText = 'Опускай плавно';
            }

            if (elbowAngle > 150 && stage === 'UP') {
                repsCount++;
                stage = 'DOWN';
                repCounter.innerText = repsCount;
                statusMessage.innerText = 'Прекрасно!';
            }

            if (elbowAngle > 150 && stage === 'DOWN') {
                statusMessage.innerText = 'Согни локоть полностью';
            }
        } else if (currentExercise === 'shoulders') {
            const elbow = landmarks[13];
            const shoulder = landmarks[11];
            const hip = landmarks[23];

            const lateralAngle = calculateAngle(elbow, shoulder, hip);

            if (lateralAngle > 80) {
                stage = 'UP';
                statusMessage.innerText = 'Хороший размах, опускай';
            }

            if (lateralAngle < 35 && stage === 'UP') {
                repsCount++;
                stage = 'DOWN';
                repCounter.innerText = repsCount;
                statusMessage.innerText = 'Есть повтор!';
            }

            if (lateralAngle > 115) {
                statusMessage.classList.add('error-mode');
                statusMessage.innerText = '⚠️ Не задирай руки выше плеч!';
            }
        }
    }

    function drawSkeleton(landmarks) {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        const connections = [
            [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
            [11, 23], [12, 24], [23, 24],
            [23, 25], [24, 26], [25, 27], [26, 28]
        ];

        const w = canvasElement.width;
        const h = canvasElement.height;

        canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        canvasCtx.lineWidth = 4;

        connections.forEach(([startIdx, endIdx]) => {
            const start = landmarks[startIdx];
            const end = landmarks[endIdx];

            if (start && end && start.visibility > 0.5 && end.visibility > 0.5) {
                canvasCtx.beginPath();
                canvasCtx.moveTo(start.x * w, start.y * h);
                canvasCtx.lineTo(end.x * w, end.y * h);
                canvasCtx.stroke();
            }
        });

        canvasCtx.fillStyle = '#00ff66';

        const activeLandmarks = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

        activeLandmarks.forEach(idx => {
            const pt = landmarks[idx];

            if (pt && pt.visibility > 0.5) {
                canvasCtx.beginPath();
                canvasCtx.arc(pt.x * w, pt.y * h, 7, 0, 2 * Math.PI);
                canvasCtx.fill();

                canvasCtx.shadowColor = '#00ff66';
                canvasCtx.shadowBlur = 10;
            }
        });

        canvasCtx.shadowBlur = 0;
    }

    function onPoseResults(results) {
        if (loadingScreen.style.display !== 'none') {
            loadingScreen.style.display = 'none';
        }

        if (results.poseLandmarks) {
            analyzePose(results.poseLandmarks);
            drawSkeleton(results.poseLandmarks);
        }
    }

    const pose = new Pose({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onPoseResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            if (canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            await pose.send({ image: videoElement });
        },
        width: 1280,
        height: 720
    });

    camera.start().catch(() => {
        alert('Камера заблокирована или используется в другом приложении!');
    });

    document.getElementById('finishSetBtn').addEventListener('click', () => {
        if (window.AndroidBridge) {
            window.AndroidBridge.saveCapturedSet(repsCount);
        } else {
            alert(`Данные тренировки:\nПовторений: ${repsCount}\n(Тест вне приложения Android)`);
        }
    });
</script>
</body>
</html>
